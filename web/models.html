<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" id="theme-color" content="#f3f5f0">
	<title>可用模型 · Sub2API Ops</title>
	<script src="/theme.js"></script>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<main class="shell">
		<div class="topline">
			<div class="brand"><span class="brand-mark" aria-hidden="true">S</span> Sub2API Ops</div>
			<div class="top-actions">
				<span>模型目录</span>
				<a class="nav-link" href="/">用户用量</a>
				<button class="icon-button" id="theme-toggle" type="button" aria-label="切换到暗色模式" title="切换到暗色模式">
					<span id="theme-icon" aria-hidden="true">☾</span>
				</button>
				<button class="icon-button" id="refresh-button" type="button" aria-label="刷新模型列表" title="刷新模型列表">
					<span aria-hidden="true">↻</span>
				</button>
				<button class="key-button" id="key-open-button" type="button">输入 Key</button>
			</div>
		</div>

		<section aria-labelledby="page-title">
			<div class="intro">
				<div>
					<p class="eyebrow">Model catalog</p>
					<h1 id="page-title">可用模型</h1>
				</div>
				<p class="intro-note">查看当前 Key 可访问的模型，包含上下文窗口、最大输出与输入输出支持。</p>
			</div>

			<p class="feedback" id="feedback" role="status" aria-live="polite">请输入有效 Key 后查询。</p>
		</section>

		<section id="results" hidden aria-label="模型列表">
			<div class="list-heading">
				<h2>模型列表</h2>
				<div class="list-tools">
					<span class="list-caption" id="model-caption">共 0 个模型</span>
					<button class="ghost-button" id="export-open-button" type="button" aria-pressed="false" disabled>生成配置</button>
				</div>
			</div>
			<div class="models-grid" id="models-grid"></div>
			<div class="empty-state" id="empty-state" hidden>当前 Key 下没有可用的模型。</div>
			<div class="selection-bar" id="selection-bar" hidden>
				<span class="selection-count" id="selection-count">已选 0 个模型</span>
				<div class="selection-actions">
					<button class="ghost-button" id="selection-all-button" type="button">全选</button>
					<button class="ghost-button" id="selection-none-button" type="button">全不选</button>
					<button class="ghost-button" id="selection-cancel-button" type="button">取消</button>
					<button class="submit-button selection-submit" id="selection-export-button" type="button" disabled>生成配置</button>
				</div>
			</div>
		</section>

		<footer class="footer">
			<span>数据由 Sub2API 提供</span>
			<span>Key 保存在当前浏览器 Cookie，有效期 30 天</span>
		</footer>
	</main>

	<dialog class="key-dialog" id="key-dialog" aria-labelledby="key-dialog-title">
		<div class="dialog-heading">
			<div>
				<p class="eyebrow">Access</p>
				<h2 id="key-dialog-title">输入 API Key</h2>
			</div>
			<button class="icon-button dialog-close" id="key-close-button" type="button" aria-label="关闭" title="关闭">×</button>
		</div>
		<p class="dialog-description">使用有效的用户 API Key 查询可用模型。</p>
		<form class="key-form" id="query-form">
			<div class="key-field">
				<label for="api-key">API Key</label>
				<input id="api-key" name="key" type="password" placeholder="请输入有效的用户 API Key" autocomplete="current-password" required>
			</div>
			<button class="submit-button" id="submit-button" type="submit">查询模型</button>
		</form>
		<p class="feedback dialog-feedback" id="key-feedback" role="status" aria-live="polite"></p>
	</dialog>

	<dialog class="key-dialog export-dialog" id="export-dialog" aria-labelledby="export-dialog-title">
		<div class="dialog-heading">
			<div>
				<p class="eyebrow">Export</p>
				<h2 id="export-dialog-title">生成配置</h2>
			</div>
			<button class="icon-button dialog-close" id="export-close-button" type="button" aria-label="关闭" title="关闭">×</button>
		</div>
		<div class="export-format" id="export-format" role="group" aria-label="配置格式">
			<button class="format-button is-active" type="button" data-format="copilot" aria-pressed="true">Copilot</button>
		</div>
		<p class="dialog-description" id="export-description">以下 JSON 可直接用于 Copilot 的自定义模型配置。</p>
		<div class="export-field">
			<label for="export-url">服务地址</label>
			<div class="export-url-box">
				<input id="export-url" type="text" role="combobox" aria-expanded="false" aria-controls="export-url-list" aria-autocomplete="list" spellcheck="false" autocomplete="off" placeholder="正在获取 API 端点...">
				<span class="export-url-caret" aria-hidden="true">▾</span>
				<ul class="export-url-list" id="export-url-list" role="listbox" aria-label="服务地址候选" hidden></ul>
			</div>
		</div>
		<textarea class="export-output" id="export-output" readonly spellcheck="false" aria-label="Copilot 配置 JSON"></textarea>
		<div class="export-actions">
			<p class="feedback dialog-feedback" id="export-feedback" role="status" aria-live="polite"></p>
			<button class="submit-button export-copy" id="export-copy-button" type="button">复制配置</button>
		</div>
	</dialog>

	<p class="visually-hidden" id="copy-status" role="status" aria-live="polite"></p>
	<script src="/models.js" defer></script>
</body>
</html>
